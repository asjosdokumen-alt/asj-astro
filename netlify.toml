# ─── Netlify Configuration ───
# Astro static site + Netlify Functions backend

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_ENV = "production"

# Backend functions
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = [
    "netlify/functions/_lib/**",
    "netlify/functions/shared/**"
  ]

# Phase 5: Job queue sweep every 2 minutes
[functions."sweep-queue"]
  schedule = "*/2 * * * *"

# Cache headers
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[redirects]]
  from = "/candidate"
  to = "/index.html"
  status = 200

# ─── Phase A: legacy function aliases — REMOVED 2026-09-11 ───────────────────
#
#   [[redirects]]
#     from = "/.netlify/functions/admin-ai-context"
#     to   = "/.netlify/functions/bridge-links"
#     status = 200
#     force  = true            # (repeated for each of the 12)
#
# WHY THEY ARE GONE
# Netlify REJECTS every one of them. The deploy log says, for each rule:
#
#   Could not parse redirect number N:
#     "path" field must not start with "/.netlify"
#
# Netlify reserves the /.netlify/ namespace and will not let a redirect rule
# match a path inside it. So `force = true` (which Phase A's notes correctly
# identified as necessary for shadowing) was never the blocker — the rules were
# discarded at parse time, before shadowing was even considered. They looked
# like a working compatibility layer for months while doing nothing at all.
#
# WHY REMOVING THEM IS SAFE
# The aliases were an optimisation, not a correctness requirement. Each legacy
# entry point is a 109-byte stub that dispatches the full router:
#
#   'use strict';
#   const { makeHandler } = require('./_lib/netlify-wrapper');
#   exports.handler = makeHandler();
#
# Those files are still deployed, so /.../whatsapp, /.../apply etc. keep working
# natively. The client never used them anyway — src/lib/apiClient.ts routes
# every action to its narrow /surfaces/* endpoint, with bridge-links as the 404
# fallback. The legacy paths matter only for old QR codes and bookmarks.
#
# The only real cost of keeping the files is bundle size (~693 KB each), which
# is Phase A's carry-forward. Deleting them requires no alias to replace them,
# because the aliases never existed in the first place — but the deploy-verify
# step still applies: confirm each legacy path responds 200 before removing it.
