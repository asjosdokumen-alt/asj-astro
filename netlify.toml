# run-migration: the ACTION was already removed from the registry (schema
# changes must never be POST-reachable). The entry point was deleted in Phase A
# and the admin UI button that called it is gone. This alias keeps any stray
# legacy caller on a graceful NOT_IMPLEMENTED instead of a 404.
[[redirects]]
  from = "/.netlify/functions/run-migration"
  to = "/.netlify/functions/bridge-links"
  status = 200
  force = true

