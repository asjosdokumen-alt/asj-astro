# ─── Netlify Configuration ───
# Astro static site + Netlify Functions backend

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_ENV = "production"

# Backend functions
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = [
    "netlify/functions/_lib/**",
    "netlify/functions/shared/**",
    # The Firebase service account is deliberately NOT listed here.
    #
    # It cannot be: netlify/functions/secrets/* is gitignored (it is a live
    # private key), and Netlify builds from the git clone — so at build time the
    # file never exists and this glob could only ever match nothing.
    #
    # It does not need to be, either. The credential stays in the
    # FIREBASE_SERVICE_ACCOUNT env var, which is fine now that this site no
    # longer runs in Lambda compatibility mode — the 4 KB per-function ceiling
    # that motivated the file is gone. _lib/fcm-server.ts still tries the file
    # first and falls back to the env var, so local "netlify dev" and any manual
    # CLI deploy keep working unchanged.
    #
    # See docs/archive/RENCANA_KELUAR_DARI_LAMBDA_MODE.md.
  ]

# Phase 5: Job queue sweep every 2 minutes
#
# The schedule is NOT here any more. Modern Netlify Functions declare it in the
# function's own config (netlify/functions/sweep-queue.ts):
#
#   export const config = { schedule: '*/2 * * * *' };
#
# Same expression as the line this block used to hold. If the sweep ever stops
# running, check that export first — a schedule that moves without being
# verified is the quietest way to break the queue.
#
# There are TWO scheduled functions now. The second is
# netlify/functions/agenda-reminders.ts at '*/10 * * * *' (agenda reminders,
# added 2026-09-13). It is looser than the sweep on purpose: its narrowest window
# is one hour wide, so minute-level latency does not matter. Reminders not
# arriving is the symptom; that export is the first thing to check.

# Cache headers
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# ─── Security headers (2026-10-04) ───────────────────────────────────────────
#
# These are the headers that are pure wins: none of them can break a working
# page. Measured before adding — the app uses no getUserMedia / mediaDevices /
# geolocation anywhere under src/, so denying those APIs costs nothing.
#
# A Content-Security-Policy is deliberately ABSENT. Astro inlines boot scripts
# and styles, so a CSP written without collecting violations on the real build
# would either break the site or be so loose it means nothing. That task starts
# by observing the deployed page, not by guessing here.
#
#   X-Content-Type-Options     stops a mis-served upload being sniffed as HTML/JS
#   X-Frame-Options            this site is never legitimately framed
#   Referrer-Policy            job codes ride in URLs; don't leak them cross-origin
#   Permissions-Policy         camera/mic/geolocation are unused — deny them
#   Strict-Transport-Security  HTTPS-only, and the site is HTTPS-only anyway
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# ─── REMOVED 2026-10-03: the `/candidate` → `/index.html` rewrite ────────────
#
#   [[redirects]]
#     from = "/candidate"
#     to   = "/index.html"
#     status = 200
#
# WHY IT WAS ALREADY DEAD IN PRODUCTION
#   Netlify applies a redirect only when NO static file matches the path, unless
#   the rule sets `force = true` — the same shadowing semantics the Phase A note
#   below relies on. `src/pages/candidate.astro` (added 2026-08-28, one day
#   BEFORE this rule) builds to `dist/candidate/index.html`, so production has
#   always served the real dashboard and never this rewrite. Measured on the
#   frozen 2026-09-24 deploy: `dist/candidate/index.html` is 102,087 bytes and
#   titled "Dashboard Kandidat — ASJ Portal".
#
# WHY IT STILL HAD TO GO
#   It was not merely inert — it was WRONG. `dist/index.html` is the landing page
#   (201,882 bytes, "PT Amanah Sakura Japan — Job Portal"), so if the rule ever
#   did take effect it would send candidates to the marketing page instead of
#   their dashboard.
#
#   And it was not inert in development. `netlify dev` DOES honour it, so
#   `/candidate` answered 404 on the local preview while `/admin`, `/loker` and
#   the rest answered 200 — measured 2026-10-03 on `netlify dev --port 8888`
#   with an Astro dev server behind it. The same path returned 200 on the Astro
#   dev server directly (port 4399), which is what isolated the cause to this
#   rule rather than to the page. A local preview whose `/candidate` 404s cannot
#   exercise the candidate dashboard at all.

# ─── Phase A: legacy function aliases — REMOVED 2026-09-11 ───────────────────
#
#   [[redirects]]
#     from = "/.netlify/functions/admin-ai-context"
#     to   = "/.netlify/functions/bridge-links"
#     status = 200
#     force  = true            # (repeated for each of the 12)
#
# WHY THEY ARE GONE
# Netlify REJECTS every one of them. The deploy log says, for each rule:
#
#   Could not parse redirect number N:
#     "path" field must not start with "/.netlify"
#
# Netlify reserves the /.netlify/ namespace and will not let a redirect rule
# match a path inside it. So `force = true` (which Phase A's notes correctly
# identified as necessary for shadowing) was never the blocker — the rules were
# discarded at parse time, before shadowing was even considered. They looked
# like a working compatibility layer for months while doing nothing at all.
#
# WHY REMOVING THEM IS SAFE
# The aliases were an optimisation, not a correctness requirement. Each legacy
# entry point was a 109-byte stub that dispatched the full router:
#
#   'use strict';
#   const { makeHandler } = require('./_lib/netlify-wrapper');
#   exports.handler = makeHandler();
#
# Those files have now been DELETED (2026-09-11, Phase A carry-forward). The
# client never used them — src/lib/apiEndpoint.ts routes every action to its own
# narrow entry point and falls back to bridge-links, which is kept as the single
# permanent catch-all. The legacy paths mattered only for old QR codes and
# bookmarks, and those never worked anyway: the alias rules that were supposed
# to serve them were rejected at deploy-parse time.
#
# WHY DELETING THE STUBS WAS MORE THAN A SIZE FIX
# A "109-byte" stub is 109 bytes on disk but ~1,508 KB bundled: makeHandler()
# statically imports surfaces/registry, which pulls in all 15 surfaces and 14
# contexts. Each stub was therefore an unrestricted monolith that answered
# EVERY action regardless of surface, with no allow-list — verified live:
#
#   POST /apply     {"action":"getAppData"} -> 200 with real job rows
#   POST /whatsapp  {"action":"getAppData"} -> 200 with real job rows
#
# So the 11 stubs were not inert dead weight; they were 11 unaudited public
# entry points that bypassed the per-surface allow-list boundary entirely, at
# 1.5 MB each (16.6 MB of the ~21 MB deployed). Removing them reclaims the
# size AND closes the boundary hole. bridge-links remains the only
# makeHandler() entry point, by design, as the documented 404 fallback.
