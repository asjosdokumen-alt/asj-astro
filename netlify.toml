# ─── Netlify Configuration ───
# Astro static site + Netlify Functions backend

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_ENV = "production"

# Backend functions
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = [
    "netlify/functions/_lib/**",
    "netlify/functions/shared/**"
  ]

# Phase 5: Job queue sweep every 2 minutes
[functions."sweep-queue"]
  schedule = "*/2 * * * *"

# Cache headers
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[redirects]]
  from = "/candidate"
  to = "/index.html"
  status = 200

# ─── Phase A: legacy function aliases — REMOVED 2026-09-11 ───────────────────
#
#   [[redirects]]
#     from = "/.netlify/functions/admin-ai-context"
#     to   = "/.netlify/functions/bridge-links"
#     status = 200
#     force  = true            # (repeated for each of the 12)
#
# WHY THEY ARE GONE
# Netlify REJECTS every one of them. The deploy log says, for each rule:
#
#   Could not parse redirect number N:
#     "path" field must not start with "/.netlify"
#
# Netlify reserves the /.netlify/ namespace and will not let a redirect rule
# match a path inside it. So `force = true` (which Phase A's notes correctly
# identified as necessary for shadowing) was never the blocker — the rules were
# discarded at parse time, before shadowing was even considered. They looked
# like a working compatibility layer for months while doing nothing at all.
#
# WHY REMOVING THEM IS SAFE
# The aliases were an optimisation, not a correctness requirement. Each legacy
# entry point was a 109-byte stub that dispatched the full router:
#
#   'use strict';
#   const { makeHandler } = require('./_lib/netlify-wrapper');
#   exports.handler = makeHandler();
#
# Those files have now been DELETED (2026-09-11, Phase A carry-forward). The
# client never used them — src/lib/apiEndpoint.ts routes every action to its own
# narrow entry point and falls back to bridge-links, which is kept as the single
# permanent catch-all. The legacy paths mattered only for old QR codes and
# bookmarks, and those never worked anyway: the alias rules that were supposed
# to serve them were rejected at deploy-parse time.
#
# WHY DELETING THE STUBS WAS MORE THAN A SIZE FIX
# A "109-byte" stub is 109 bytes on disk but ~1,508 KB bundled: makeHandler()
# statically imports surfaces/index, which pulls in all 15 surfaces and 14
# contexts. Each stub was therefore an unrestricted monolith that answered
# EVERY action regardless of surface, with no allow-list — verified live:
#
#   POST /apply     {"action":"getAppData"} -> 200 with real job rows
#   POST /whatsapp  {"action":"getAppData"} -> 200 with real job rows
#
# So the 11 stubs were not inert dead weight; they were 11 unaudited public
# entry points that bypassed the per-surface allow-list boundary entirely, at
# 1.5 MB each (16.6 MB of the ~21 MB deployed). Removing them reclaims the
# size AND closes the boundary hole. bridge-links remains the only
# makeHandler() entry point, by design, as the documented 404 fallback.
