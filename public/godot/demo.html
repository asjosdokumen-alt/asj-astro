<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASJ Belajar — Mode Godot (beta)</title>
<style>
  :root { color-scheme: dark; --navy:#101a2e; --naik:#1b2740; --sakura:#ff8fbf; --amber:#f5b942; --emerald:#34d399; --krem:#fdf6ec; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--navy); color:var(--krem); font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; overflow:hidden; }
  #asj-godot { position:fixed; inset:0; }
  #asj-godot canvas { display:block; width:100%; height:100%; }
  header { position:fixed; top:0; left:0; right:0; z-index:3; padding:10px 14px; display:flex; align-items:center; gap:10px; background:linear-gradient(180deg, rgba(16,26,46,.92), rgba(16,26,46,0)); pointer-events:none; }
  header b { font-size:14px; letter-spacing:.02em; }
  header span { font-size:11px; color:#b4b2a9; }
  #asj-godot-status { position:fixed; top:44px; left:14px; z-index:3; font-size:11px; color:#b4b2a9; }
  #asj-godot-progress { position:fixed; top:62px; left:14px; right:14px; z-index:3; height:4px; accent-color:var(--amber); display:none; }
  #asj-godot-log { position:fixed; top:76px; left:14px; z-index:3; font-size:10px; line-height:1.45; color:#9fe1cb; max-width:70vw; pointer-events:none; }
  nav { position:fixed; left:0; right:0; bottom:0; z-index:4; display:flex; gap:8px; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); background:rgba(16,26,46,.9); backdrop-filter:blur(10px); border-top:1px solid rgba(245,185,66,.25); }
  button { flex:1; min-height:48px; border-radius:12px; border:1px solid rgba(245,185,66,.65); background:var(--naik); color:var(--krem); font:600 13px/1 ui-sans-serif, system-ui; touch-action:manipulation; }
  button.aktif { background:var(--amber); color:var(--navy); }
  button:active { transform:translateY(1px); }
  @media (min-width:720px) { nav { max-width:560px; margin:0 auto; border-radius:16px 16px 0 0; } }
</style>
</head>
<body>
<header><b>ASJ Belajar</b><span>Godot 4.7 · Web · single-thread</span></header>
<div id="asj-godot" data-aktif="0"></div>
<div id="asj-godot-status">Tekan salah satu mode untuk mengunduh mesin (sekali).</div>
<progress id="asj-godot-progress" max="100" value="0"></progress>
<div id="asj-godot-log"></div>
<nav>
  <button data-game="genba">Genba</button>
  <button data-game="combo">Combo</button>
  <button data-game="kotoba">Kotoba</button>
  <button data-game="matematika">Figural</button>
</nav>
<script src="/godot/asj-loader.js"></script>
<script>
(function () {
  'use strict';
  var game = '';
  var timer = 0;
  var n = 0;
  var loop = 0;

  function log(t) {
    var b = document.getElementById('asj-godot-log');
    if (!b) return;
    var d = document.createElement('div');
    d.textContent = t;
    b.appendChild(d);
    while (b.childNodes.length > 7) b.removeChild(b.firstChild);
  }

  function acak(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }

  function rondeGenba() {
    var pesanan = [];
    for (var i = 0; i < 8; i++) {
      pesanan.push({ id: 'demo-' + loop + '-' + i, barang: acak(0, 11), rak: acak(0, 3), batasMs: Math.max(2500, 8000 - loop * 250) });
    }
    window.ASJGodot.kirim({ v: 1, type: 'round', game: 'genba', payload: { pesanan: pesanan, zona: 4, loop: loop, batasMs: 8000 } });
  }

  function rondeCombo() {
    window.ASJGodot.kirim({ v: 1, type: 'round', game: 'combo', payload: { kartu: 7 } });
    clearInterval(timer);
    n = 0;
    timer = setInterval(function () {
      n++;
      var aksi = n % 7 === 0 ? 'selesai' : n % 5 === 0 ? 'salah' : 'benar';
      window.ASJGodot.kirim({ v: 1, type: 'combo', game: 'combo', payload: { aksi: aksi, indeks: acak(0, 6), kombo: 1 + (n % 10) } });
    }, 650);
  }

  function rondeKotoba() {
    clearInterval(timer);
    n = 0;
    timer = setInterval(function () {
      n = (n + 1) % 31;
      window.ASJGodot.kirim({ v: 1, type: 'progress', game: 'kotoba', payload: { daun: n, tier: Math.min(2, Math.floor(n / 10)), musim: Math.floor(n / 8) % 4, streak: n } });
    }, 380);
  }

  function rondeFigural() {
    var bentuk = ['L', 'pisau', 'bendera'][acak(0, 2)];
    window.ASJGodot.kirim({ v: 1, type: 'round', game: 'matematika', payload: { bentuk: bentuk, putar: [0, 90, 180, 270][acak(0, 3)], cermin: Math.random() < 0.5 } });
  }

  function kirimAwal(g) {
    loop = 0;
    if (g === 'genba') rondeGenba();
    else if (g === 'combo') rondeCombo();
    else if (g === 'kotoba') rondeKotoba();
    else rondeFigural();
  }

  function pilih(g) {
    game = g;
    var tombol = document.querySelectorAll('nav button');
    for (var i = 0; i < tombol.length; i++) tombol[i].classList.toggle('aktif', tombol[i].dataset.game === g);
    clearInterval(timer);
    document.getElementById('asj-godot').dataset.aktif = '1';
    if (!window.ASJGodot.status().siap) {
      window.ASJGodot.mulai();
      window.addEventListener('asj:godot-ready', function () { kirimAwal(game); }, { once: true });
    } else {
      kirimAwal(g);
    }
  }

  document.querySelectorAll('nav button').forEach(function (b) {
    b.addEventListener('click', function () { pilih(b.dataset.game); });
  });

  window.addEventListener('asj:godot', function (e) {
    var m = e.detail;
    log(m.type + ' · ' + (m.game || '') + (m.payload && m.payload.benar !== undefined ? ' · ' + (m.payload.benar ? 'benar' : 'salah') : ''));
    if (m.type === 'finish' && m.game === 'genba') {
      loop = (m.payload && m.payload.loop ? m.payload.loop : 0) + 1;
      log('ULTIMATE LOOP ' + loop + ' · presisi ' + (m.payload && m.payload.presisiMs ? m.payload.presisiMs : 0) + ' ms');
      setTimeout(rondeGenba, 900);
    }
    if (m.type === 'answer' && m.game === 'matematika' && m.payload && m.payload.aksi === 'jawab') {
      setTimeout(rondeFigural, 700);
    }
  });
})();
</script>
</body>
</html>
