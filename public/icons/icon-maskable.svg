<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="ASJ Portal">
  <!-- Maskable variant: the mark is scaled DOWN so that the platform's mask
       (circle, squircle, rounded square) never clips it. Everything of
       interest sits within a centred radius of 205/256 = 80%. -->
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="mark2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#e11d48"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg2)"/>

  <g transform="translate(256 250) scale(0.72)">
    <g fill="url(#mark2)">
      <ellipse cx="0" cy="-104" rx="42" ry="66"/>
      <ellipse cx="0" cy="-104" rx="42" ry="66" transform="rotate(72)"/>
      <ellipse cx="0" cy="-104" rx="42" ry="66" transform="rotate(144)"/>
      <ellipse cx="0" cy="-104" rx="42" ry="66" transform="rotate(216)"/>
      <ellipse cx="0" cy="-104" rx="42" ry="66" transform="rotate(288)"/>
    </g>
    <circle cx="0" cy="0" r="26" fill="#fde68a"/>
  </g>
</svg>
