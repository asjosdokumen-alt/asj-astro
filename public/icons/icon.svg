<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="ASJ Portal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#e11d48"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background. Safe for maskable: all content stays inside the
       80% safe zone (radius 256 → safe radius ~205 from centre). -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Cherry blossom: the ASJ ("Sakura") mark. Placed inside the safe zone. -->
  <g transform="translate(256 262)">
    <g fill="url(#mark)">
      <ellipse cx="0" cy="-104" rx="42" ry="66"/>
      <ellipse cx="0" cy="-104" rx="42" ry="66" transform="rotate(72)"/>
      <ellipse cx="0" cy="-104" rx="42" ry="66" transform="rotate(144)"/>
      <ellipse cx="0" cy="-104" rx="42" ry="66" transform="rotate(216)"/>
      <ellipse cx="0" cy="-104" rx="42" ry="66" transform="rotate(288)"/>
    </g>
    <circle cx="0" cy="0" r="26" fill="#fde68a"/>
  </g>

  <!-- Wordmark, kept small and inside the safe zone. -->
  <text x="256" y="452" text-anchor="middle"
        font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="60" font-weight="700" letter-spacing="6" fill="#e2e8f0">ASJ</text>
</svg>
