name: CI

# ─────────────────────────────────────────────────────────────────────────────
# Continuous integration: every push and pull request is built and verified once,
# here. The artifact produced by this pipeline is the EXACT artifact that gets
# deployed — staging and production never rebuild. That removes the most common
# source of "works in CI, broken in prod".
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      run-e2e:
        description: 'Run the Playwright E2E suite (slower)'
        type: boolean
        default: false

permissions:
  contents: read

# Superseded pushes on the same branch cancel the previous run — faster feedback
# and no wasted runner minutes. Deploy workflows deliberately do NOT cancel,
# because cancelling a deploy halfway is worse than letting it finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  NODE_OPTIONS: '--max-old-space-size=4096'

jobs:
  # ══ Gate 1 · static analysis ════════════════════════════════════════════════
  # These three are independent and run concurrently.

  typecheck:
    name: Typecheck · no new errors
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-env
      # Debt-aware gate: the repo carries historical type errors, so we block NEW
      # errors rather than all of them. See scripts/ci/typecheck-ratchet.mjs.
      - name: Enforce no-new-type-errors ratchet
        run: npm run typecheck:ratchet

  boundary:
    name: Architecture boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-env
      - name: Check layering rules (dependency-cruiser)
        run: npm run boundary

  # ══ Gate 1a · CSS classes that style nothing ════════════════════════════════
  # Tailwind generates utilities by scanning the source, so a class written in
  # markup either produces a rule or silently renders unstyled — no error, no
  # warning, no failing test. That defect has recurred four times here (§2,
  # §11.4, §14.2, §20), so `verify:classes` checks the whole tree at once using
  # Tailwind's own compiler, which needs no build step (~0.5 s).
  # It is proven able to fail by scripts/ci/verify-classes.mutations.sh.
  classes:
    name: Classes · every class has a rule
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-env
      - name: Verify every class token has a rule
        run: npm run verify:classes

  # ══ Gate 1b · the gates CI used to skip ═════════════════════════════════════
  # These live in `ci:quality` (the local script) but were referenced NOWHERE under
  # .github, so a regression in the functions tree could reach production without
  # CI ever running the gate that exists to catch it. That is not theoretical:
  # `surfaces/index.ts` shipped as a Lambda-COMPATIBILITY-MODE function with no
  # handler, which kept the 4 KB per-function env ceiling alive for the whole site
  # and killed every deploy on 2026-09-12 — after all 21 real entry points had
  # already migrated. `verify:entries` now asserts that rule (check 3b) instead of
  # documenting it, but an assertion nobody runs protects nothing.

  functions-tree:
    name: Functions tree + bundle ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-env
      # Deploy shape: no root .test.*, no devDependency imports, every root entry
      # exports a handler, and no direct subdirectory deploys as a function.
      - name: Verify the functions tree matches what Netlify will deploy
        run: npm run verify:entries
      # Only bridge-links.js may call makeHandler() (the catch-all).
      - name: Verify surface binding
        run: npm run verify:binding
      # No raw fetch() outside kernel/http.ts — it would bypass deadline, breaker,
      # bulkhead, metrics and traceparent.
      - name: Verify the I/O boundary
        run: npm run verify:io
      # Total deployed size may ratchet down, never up silently.
      - name: Enforce the bundle-size ratchet
        run: npm run bundle:size
      # Indexer impact gate — depends on the whole graph, so it runs last.
      - name: Indexer impact gate
        run: npm run idx:gate

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Report-only for now. Flip `continue-on-error` to false once the production
    # dependency tree is clean — otherwise every PR inherits today's advisories.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  # ══ Gate 2 · unit tests (sharded, parallel) ═════════════════════════════════

  # The migration-013 admin-only guard is a TRIGGER, so its verdict only exists
  # inside a real UPDATE — there is nothing to assert statically. This job starts
  # a throwaway PostgreSQL (from the `embedded-postgres` devDependency) and drives
  # the genuine SQL through a PostgREST-shaped session.
  #
  # It needs NO credentials and NO network: no Supabase URL, no service-role key,
  # no live database. A public repo also has no CI minute cap, so the cost of
  # proving a security guard on every PR is just a few seconds of runner time.
  #
  # Why it is not in `verify:batteries`: that runner is hermetic-only by design
  # and this needs a database engine. It is a separate job for the same reason
  # `boundary` is — it needs its own timeout and its own failure message.
  biodata-guard:
    name: Migration-013 admin-only guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-env
      - name: Prove the guard blocks self-approval
        run: npm run biodata:guard

  test-frontend:
    name: Unit tests · frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-env
      - name: Run frontend suite (jsdom)
        run: npm run test:frontend

  test-backend:
    name: Unit tests · backend ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Keep running every shard even if one fails, so a single red test does not
      # hide failures in the other shards.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-env
      - name: Run backend suite shard ${{ matrix.shard }} of ${{ strategy.job-total }}
        run: npm run test:backend -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  # ══ Gate 3 · build + artifact ═══════════════════════════════════════════════

  # ══ Gate 3 · build + artifact ═══════════════════════════════════════════════
  # Delegates to the shared reusable build so CI and both deploy pipelines
  # produce bit-identical artifacts from the same definition.

  build:
    name: Build artifact
    uses: ./.github/workflows/_build.yml

  # ══ Gate 4 · verify the artifact actually serves ════════════════════════════

  smoke:
    name: Smoke test artifact
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-env
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}

      # The PWA manifest and icon wiring: a remote or missing icon href is
      # invisible in dev and shows up only as a broken install prompt in prod.
      #
      # It lives HERE, not in quality-gates, because it reads `dist/sw.js` and
      # only this job has the built artifact. In quality-gates it failed on every
      # run for that reason alone — the note left there has the measurement.
      - name: Verify the PWA manifest and icons
        run: npm run verify:pwa

      # Prove the bytes we are about to test are the bytes that were built.
      - name: Verify artifact integrity
        run: |
          EXPECTED=$(node -e "console.log(require('./build-manifest.json').sha256)")
          ACTUAL=$(find dist -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          echo "expected: $EXPECTED"
          echo "actual  : $ACTUAL"
          [ "$EXPECTED" = "$ACTUAL" ] || { echo "::error::Artifact hash mismatch"; exit 1; }

      - name: Serve artifact and smoke test
        run: |
          npm run preview -- --port 4321 > preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null "http://127.0.0.1:4321/" 2>/dev/null && break
            sleep 2
          done
          npm run smoke -- --url http://127.0.0.1:4321 --expect "Lowongan Loker" --retries 3 --backoff 1000

  # Full browser E2E. Slower, so it runs on main/develop and on demand.
  e2e:
    name: E2E · public flow
    needs: build
    if: github.event_name == 'push' || inputs.run-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-env
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run E2E against built artifact
        env:
          BASE_URL: http://127.0.0.1:4321
        run: |
          npm run preview -- --port 4321 > preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null "http://127.0.0.1:4321/" 2>/dev/null && break
            sleep 2
          done
          # One gate, one verdict: name each guard so a red run says WHICH one
          # broke. They were a single `npm run test:e2e` line until 2026-09-16,
          # and they were in NO manifest entry either -- so the whole job was
          # invisible to the inventory that claims to be the source of truth.
          # Kept in THIS step on purpose: the preview server above is a
          # background process, and a separate step may not inherit it.
          npm run e2e:public
          npm run e2e:loker-layout
          npm run e2e:headings
          npm run e2e:dialog
          npm run e2e:drawer
          npm run e2e:labels

  # ══ Gate 1c · the gates CI *still* skipped ══════════════════════════════════
  # Gate 1b above closed the gap for the functions tree. This job closes the
  # REST of it, and it exists because of one measurement (2026-09-15):
  #
  #   for g in lint-ratchet typecheck:indexer verify:md verify:projections \
  #            verify:review-manifest cold:start; do
  #     echo "$g -> $(grep -c "npm run $g" .github/workflows/ci.yml)"
  #   done
  #
  # Every one of those printed 0. They all live in the local `ci:quality`
  # script, which no workflow called either — so six gates with real teeth were
  # advisory only, and a change that broke any of them would sail through CI and
  # into a production deploy.
  #
  # `verify:projections` is the one with the sharpest edge: it enforces "no
  # SELECT *" / every column projected explicitly. A regression there is not a
  # style issue, it is how a column you did not mean to expose reaches a client.
  #
  # WHY A SEPARATE JOB RATHER THAN ONE `npm run ci:quality` LINE
  # `ci:quality` also runs the full unit suite and `idx:gate`, both of which
  # already run in their own jobs above. Calling it here would run them twice
  # (roughly doubling the slowest job) AND collapse six independent verdicts into
  # one status, so a red run would not say which gate broke. The gates are
  # listed explicitly for that second reason: each one reports under its own
  # step name.
  #
  # `cold:start` is safe to run here without a URL: the gate skips itself and
  # exits 0 when `--url` is absent, which is the correct behaviour against a
  # local artifact (no CDN, no function isolation, no pooler RTT — a measurement
  # there would be meaningless). It is asserted so the wiring cannot silently
  # point at nothing; the real measurement runs in deploy-production.yml.
  quality-gates:
    name: Gates · ratchets, docs, data contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-env
      # Lint debt may only shrink. The baseline is frozen in .ci/biome-baseline.json.
      - name: Enforce the lint ratchet
        run: npm run lint-ratchet
      # The indexer is a second TypeScript program with its own tsconfig; a type
      # error there used to be invisible to the main typecheck.
      - name: Typecheck the indexer
        run: npm run typecheck:indexer
      # Documents are load-bearing here: BACKEND_TODO and the phase docs are the
      # only record of what is verified. A broken table silently truncates them.
      - name: Verify markdown tables
        run: npm run verify:md
      # THE DATA CONTRACT. Every read must name its columns — no `SELECT *`.
      - name: Verify database column projections
        run: npm run verify:projections
      # The review manifest is what makes the other gates auditable: it records
      # which gates exist and whether each has been proven able to fail.
      - name: Verify the review manifest
        run: npm run verify:review-manifest
      # Exactly one entry point may use the full router. Extra ones were deleted
      # on 2026-09-11 (each was an unrestricted public monolith); this gate keeps
      # them from growing back silently.
      - name: Verify function aliases
        run: npm run verify:aliases
      # The workflow files, read the way GitHub reads them. Added 2026-09-17:
      # `_notify.yml` used `secrets` in a step-level `if:`, which GitHub answers
      # by refusing the WHOLE FILE, and a called workflow that will not parse
      # takes its callers with it — ci.yml, both deploy workflows and rollback.yml
      # were all dead, with zero jobs per run, and every local gate stayed green.
      # A pipeline that cannot report its own absence needs a gate that can.
      - name: Verify the workflows are ones GitHub will parse
        run: npm run verify:workflows
      # `verify:pwa` USED TO LIVE HERE, and it could never pass: it reads
      # `dist/sw.js`, and this job neither builds nor downloads an artifact, so
      # that file is absent and the gate fails on a precondition it cannot
      # satisfy. Measured 2026-09-18, on the FIRST CI run this repo ever actually
      # executed (step 11, "Verify the PWA manifest and icons"). It moved to the
      # `smoke` job, which downloads the built artifact — see the note there.
      #
      # The lesson is the repo's own: a gate is only as good as the job it is
      # placed in. This one was green locally (where `dist/` exists from a dev
      # build) and red in CI, and neither verdict was about the PWA.
      # Whether the surface bindings all resolve, and whether anything bypassed
      # the HTTP kernel. Both are static checks with no live environment, so they
      # belong here where every PR pays them — not only on the deploy path.
      - name: Verify surface bindings and the IO boundary
        run: npm run verify:binding && npm run verify:io
      # Is input validated at the handler edge? Three documents claimed this was
      # universal while the measured reality was 7 of 81 actions, all in one
      # surface. The unvalidated set is frozen in .ci/validation-baseline.json
      # and may only shrink; this step is what keeps that claim measurable.
      - name: Verify validation coverage at the handler edge
        run: npm run verify:validation
      # Cold start has a real budget (3 s). Without --url it self-skips; the
      # deploy workflow supplies the URL. Run it so the wiring is exercised.
      - name: Cold-start gate (self-skips without a URL)
        run: npm run cold:start

  # ══ Gate 1d · re-prove the gates' own batteries ════════════════════════════
  # THE GATE THAT MAKES "proven able to fail" MEAN SOMETHING TODAY.
  #
  # `verify:review-manifest` prints `proven able to fail 23/23 (100%)`, and that
  # number was true and useless at the same time: it recorded that a battery
  # EXISTS, never that the battery still discriminates. Measured 2026-09-15 —
  # before this job existed — `grep -c 'mutations\.sh' .github/workflows/*.yml`
  # returned ONE hit, and that hit is a comment on line 68 of this file, not a
  # `run:`. No npm script invoked a battery either. So 23 proofs sat in the
  # repository and none of them had been executed since the day they were
  # written.
  #
  # The decay is not theoretical, and it was found within minutes of wiring this
  # job up. `check-md-tables.mutations.sh` reported a SURVIVED mutation: its
  # mutation A was anchored on prose in a BACKEND_TODO.md row that a later edit
  # had rewritten, so its `str.replace()` matched nothing, wrote the file back
  # unchanged, and the gate correctly stayed green. `verify-review-manifest`'s
  # battery did not even get that far — it ABORTED at case S3, because six of its
  # eleven mutations were written against a one-line `runs` array that the
  # manifest has never contained. A dead mutation and a hole in a gate look
  # identical from the outside; only re-running tells them apart.
  #
  # WHY A SEPARATE JOB
  #   One gate, one verdict. If this shared `quality-gates`, a red run would not
  #   say whether the gates or the batteries broke — and those have completely
  #   different fixes. It also has a genuinely different cost profile: the
  #   batteries re-run the gates many times each, so this is the slowest job in
  #   the pipeline by design, not by accident.
  #
  # WHAT IT DOES NOT COVER — and the runner prints this itself, so a green run is
  # never read as "everything is proven": six batteries need live infrastructure
  # (verify:env, verify:env:budget, verify:db, verify:schema, verify:rls, smoke)
  # and `depcruise` has no battery at all. Those remain unproven here.
  #
  # `verify:batteries` READS the manifest's `battery` field rather than repeating
  # a hand-typed list, so the set it runs cannot drift from the classification.
  # C7 in `verify:review-manifest` keeps that classification honest by checking
  # that a gate marked "ci" does not reach for credentials, a server or a DB.
  batteries:
    name: Batteries · every hermetic gate re-proven able to fail
    needs: build
    runs-on: ubuntu-latest
    # THE JOB MUST OUTLAST ITS OWN WATCHDOG, or the wrong thing fires first.
    # `npm run verify:batteries` runs under scripts/ci/with-timeout.mjs with a
    # 120-minute budget, and each battery is separately capped at 15 minutes by
    # the runner. A 30-minute JOB timeout would therefore kill the run before
    # either of those could report, and a job timeout says only "30 minutes
    # elapsed" — while the watchdog prints the budget, the command and the three
    # things to check. Keep this ABOVE the watchdog's budget.
    #
    # 130 is 120 + a margin for checkout/setup, and it is a ceiling rather than a
    # target: measured locally, the first 5 of the 20 hermetic batteries averaged
    # ~190 s each (~63 min extrapolated). CI runners are generally faster. This
    # number has not been measured on a full run yet, because the batteries job
    # has never completed — it is currently skipped behind the Build job, which
    # needs two repository variables.
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-env

      # WHY THIS JOB NEEDS THE ARTIFACT.
      # `verify:pwa`'s battery reads dist/sw.js and REFUSES TO RUN when dist/ is
      # absent — deliberately, because skipping cases would let it report green
      # while proving nothing. This job used to run with no build at all, so that
      # battery failed here on a precondition it could not satisfy and took the
      # whole job down in 3.8 minutes (measured 2026-09-18, on the first CI run
      # this repository ever actually executed).
      #
      # It DOWNLOADS the artifact rather than rebuilding, which matches the rule
      # stated at the top of this file: the artifact under test is the artifact
      # that ships, and nothing downstream rebuilds it.
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}

      - name: Re-run every hermetic mutation battery
        run: npm run verify:batteries

  # ══ Notification ════════════════════════════════════════════════════════════
  # Only for the shared branches. Firing on every PR would train everyone to
  # ignore the channel.

  notify-failure:
    name: Notify · build failure
    needs:
      - typecheck
      - boundary
      - functions-tree
      - quality-gates
      - batteries
      - test-frontend
      - test-backend
      - build
      - smoke
    if: failure() && github.event_name == 'push'
    uses: ./.github/workflows/_notify.yml
    with:
      status: failure
      title: 'CI failed'
      environment: ci
      run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      details: 'Branch `${{ github.ref_name }}` broke the build. Do not merge further changes until it is green.'
    secrets: inherit
